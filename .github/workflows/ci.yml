name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS: the only POSIX-but-not-Linux runner. coordination (flock) is
        # available there while atomic_restore (renameat2) refuses, and the
        # Linux-gated R8/R9 tests skip -- that branch combination is otherwise
        # never executed. Not a support claim (see pyproject classifiers).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - run: python -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)"
      # SQLite WAL-reset release gate (README). It runs here so the log records
      # every runner's real library; the waiver below is NOT a release
      # decision. SF-R39-01: only --profile ci takes a waiver, it must carry an
      # end date (at most 120 days ahead) and turns this step red when it
      # expires; a release run uses the default profile, which takes none.
      - run: python -m safeforge.sqlite_gate --profile ci
        env:
          PYTHONPATH: src
          SAFEFORGE_ALLOW_UNFIXED_SQLITE: "expires=2027-01-31; reason=PR/main CI is not a release, runtime blocking is owner decision E2 (I1026-07)"
      - run: python -m pytest -p no:cacheprovider

  # The only job with a SQLite that carries the WAL-reset fix (>= 3.51.3): no
  # runner image ships one (run 40984016099: 3.45.1 / 3.49.1 / 3.50.4). Built
  # from the official mirror pinned by commit (experiments/sqlite/build_sqlite.sh)
  # and loaded through LD_LIBRARY_PATH. The gate runs in the release profile
  # WITHOUT a waiver, and SAFEFORGE_EXPECT_FIXED_SQLITE makes the real-library
  # tests mandatory: a library that did not take effect fails them (R40).
  sqlite-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl
      - run: experiments/sqlite/build_sqlite.sh "$RUNNER_TEMP/sqlite-build"
      - run: python -m pip install pytest==9.1.1
      - run: python -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)"
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/sqlite-build/lib
      - run: python -m safeforge.sqlite_gate
        env:
          PYTHONPATH: src
          LD_LIBRARY_PATH: ${{ runner.temp }}/sqlite-build/lib
      - run: python -m pytest -p no:cacheprovider -rs
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/sqlite-build/lib
          SAFEFORGE_EXPECT_FIXED_SQLITE: "3.54.1"
          SAFEFORGE_EXPECT_FIXED_SQLITE_SOURCE_ID: "2026-10-16 14:45:20 555e07ef33f69a0957d24d8e555b702464a131d6f1607f4c3c1e4551e8e6ca76"

  # Power cut, data half: LazyFS drops every unsynced byte (tests/lazyfs_harness.py).
  # REQUIRED=1 turns a broken FUSE/LazyFS setup into a failure instead of a skip.
  powerloss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse3-dev fuse3 cmake g++ pkg-config
      - run: ls -l /dev/fuse "$(command -v fusermount3)"
      - run: experiments/lazyfs/build_lazyfs.sh "$RUNNER_TEMP/lazyfs-build"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -p no:cacheprovider -rs tests/test_powerloss_lazyfs.py tests/test_powerloss_dirmodel.py
        env:
          SAFEFORGE_LAZYFS_BIN: ${{ runner.temp }}/lazyfs-build/lazyfs/lazyfs/build/lazyfs
          SAFEFORGE_LAZYFS_REQUIRED: "1"
