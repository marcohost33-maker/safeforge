name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS: the only POSIX-but-not-Linux runner. coordination (flock) is
        # available there while atomic_restore (renameat2) refuses, and the
        # Linux-gated R8/R9 tests skip -- that branch combination is otherwise
        # never executed. Not a support claim (see pyproject classifiers).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - run: python -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)"
      # SQLite WAL-reset release gate (README). It runs here so the log records
      # every runner's real library; the waiver below is NOT a release
      # decision. SF-R39-01: only --profile ci takes a waiver, it must carry an
      # end date (at most 120 days ahead) and turns this step red when it
      # expires; a release run uses the default profile, which takes none.
      - run: python -m safeforge.sqlite_gate --profile ci
        env:
          PYTHONPATH: src
          SAFEFORGE_ALLOW_UNFIXED_SQLITE: "expires=2027-01-31; reason=PR/main CI is not a release, runtime blocking is owner decision E2 (I1026-07)"
      - run: python -m pytest -p no:cacheprovider

  # Real SQLite libraries at the classifier's boundaries: no runner image ships
  # one with the WAL-reset fix (run 40984016099: 3.45.1 / 3.49.1 / 3.50.4).
  # Built from the official mirror pinned by commit; build_sqlite.sh also checks
  # the fix in src/wal.c against the "fixed" column, so version and code agree.
  # Loaded through LD_LIBRARY_PATH; SAFEFORGE_EXPECT_SQLITE* makes the
  # real-library tests mandatory, so a library that did not take effect fails
  # them (R40, R41). The gate runs in the release profile without a waiver and
  # must exit 0 on a fixed library and 1 on the affected one.
  sqlite-real:
    name: sqlite-real (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "3.54.1"
            fixed: "true"
            gate_exit: 0
            source_id: "2026-10-16 14:45:20 555e07ef33f69a0957d24d8e555b702464a131d6f1607f4c3c1e4551e8e6ca76"
          - version: "3.51.3" # first fixed release
            fixed: "true"
            gate_exit: 0
            source_id: "2026-03-13 10:38:09 737ae4a34738ffa0c3ff7f9bb18df914dd1cad163f28fd6b6e114a344fe6d618"
          - version: "3.51.2" # last affected release
            fixed: "false"
            gate_exit: 1
            source_id: "2026-01-09 17:27:48 b270f8339eb13b504d0b2ba154ebca966b7dde08e40c3ed7d559749818cb2075"
          - version: "3.50.7" # branch-3.50 backport
            fixed: "true"
            gate_exit: 0
            source_id: "2026-03-05 01:44:06 c7facf7ac58d2cdac619a2da838c5fd5c5270f52b3458c7881b5a4fca1ca4791"
          - version: "3.44.6" # branch-3.44 backport
            fixed: "true"
            gate_exit: 0
            source_id: "2026-03-05 01:38:19 863c171b76cd36e0c71662d4a50d84da531cc7fbead893d02459577febdf6396"
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/../sqlite-build/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl
      - run: experiments/sqlite/build_sqlite.sh "$GITHUB_WORKSPACE/../sqlite-build" "$SQLITE_VERSION"
        env:
          SQLITE_VERSION: ${{ matrix.version }}
      - run: python -m pip install pytest==9.1.1
      - run: python -c "import sqlite3, sys; print(sys.version, sqlite3.sqlite_version)"
      - name: gate (release profile, no waiver), expected exit ${{ matrix.gate_exit }}
        run: |
          set +e
          python -m safeforge.sqlite_gate
          rc=$?
          set -e
          test "$rc" = "$GATE_EXIT"
        env:
          PYTHONPATH: src
          GATE_EXIT: ${{ matrix.gate_exit }}
      - run: python -m pytest -p no:cacheprovider -rs
        env:
          SAFEFORGE_EXPECT_SQLITE: ${{ matrix.version }}
          SAFEFORGE_EXPECT_SQLITE_FIXED: ${{ matrix.fixed }}
          SAFEFORGE_EXPECT_SQLITE_SOURCE_ID: ${{ matrix.source_id }}

  # Real kernel mounts (R15, SF-R41-01): a same-device bind mount (st_dev cannot
  # see it, mountinfo can), tmpfs, and overlayfs with its upper directory on disk,
  # on tmpfs, and mounted volatile. Mounted with sudo; the tests run unprivileged
  # and SAFEFORGE_MOUNT_MATRIX makes them mandatory.
  mounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: experiments/mounts/mount_matrix.sh "$RUNNER_TEMP/mnt"
      - run: grep -F "$RUNNER_TEMP/mnt" /proc/self/mountinfo
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -p no:cacheprovider -rs tests/test_r41_filesystem_class.py tests/test_r37_mount_identity.py
        env:
          SAFEFORGE_MOUNT_MATRIX: ${{ runner.temp }}/mnt

  # Power cut, data half: LazyFS drops every unsynced byte (tests/lazyfs_harness.py).
  # REQUIRED=1 turns a broken FUSE/LazyFS setup into a failure instead of a skip.
  powerloss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse3-dev fuse3 cmake g++ pkg-config
      - run: ls -l /dev/fuse "$(command -v fusermount3)"
      - run: experiments/lazyfs/build_lazyfs.sh "$RUNNER_TEMP/lazyfs-build"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -p no:cacheprovider -rs tests/test_powerloss_lazyfs.py tests/test_powerloss_dirmodel.py
        env:
          SAFEFORGE_LAZYFS_BIN: ${{ runner.temp }}/lazyfs-build/lazyfs/lazyfs/build/lazyfs
          SAFEFORGE_LAZYFS_REQUIRED: "1"
