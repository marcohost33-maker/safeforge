[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safeforge"
version = "0.1.0"
description = "Reference implementation and test bench for crash-consistent file + SQLite ingest, ZIP upload validation and idempotent events (stdlib only)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: takes several seconds (e.g. the real 5000 ms busy_timeout expiry)",
]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["UP031"]
